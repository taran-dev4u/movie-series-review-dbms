[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-db"
version = "0.1.0"
description = "Relational database management, Bayesian rating analytics, and collaborative recommendations for movie reviews."
authors = [{ name = "Taran Mamidala" }]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Database",
]
dependencies = [
    "numpy>=1.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
movie-db = "movie_db.cli:main"

[tool.setuptools.packages.find]
include = ["movie_db*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
exclude = [
    "movie-review-app",
]
